name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          script: |
            set -e

            APP_DIR=~/apps/kulturdb
            LEGACY_APP_DIR=~/apps/cinetech
            REPO_URL=https://github.com/${{ github.repository }}.git

            docker network inspect web >/dev/null 2>&1 || docker network create web

            mkdir -p $APP_DIR
            cd $APP_DIR

            if [ -d ".git" ]; then
              git fetch origin
              git reset --hard origin/main
              git clean -fd -e .env
            else
              git init
              git remote add origin $REPO_URL
              git fetch origin main
              git checkout -B main origin/main
            fi

            test -f .env

            # Auto-initialiser les variables auth critiques si elles sont absentes
            if ! grep -q '^AUTH_JWT_SECRET=' .env; then
              JWT_SECRET=$(openssl rand -hex 48 2>/dev/null || cat /proc/sys/kernel/random/uuid | tr -d '-')
              echo "AUTH_JWT_SECRET=$JWT_SECRET" >> .env
              echo "AUTH_JWT_SECRET ajoute automatiquement dans .env"
            fi

            if ! grep -q '^AUTH_SESSION_SECRET=' .env; then
              SESSION_SECRET=$(openssl rand -hex 48 2>/dev/null || cat /proc/sys/kernel/random/uuid | tr -d '-')
              echo "AUTH_SESSION_SECRET=$SESSION_SECRET" >> .env
              echo "AUTH_SESSION_SECRET ajoute automatiquement dans .env"
            fi

            if ! grep -q '^FRONTEND_BASE_URL=' .env; then
              echo "FRONTEND_BASE_URL=https://moviedb.azim404.com" >> .env
            fi

            if ! grep -q '^AUTH_BASE_URL=' .env; then
              echo "AUTH_BASE_URL=https://moviedb.azim404.com" >> .env
            fi

            # Coupe proprement l'ancien stack cinetech si encore present apres rebrand.
            if [ -d "$LEGACY_APP_DIR" ] && [ "$LEGACY_APP_DIR" != "$APP_DIR" ]; then
              if [ -f "$LEGACY_APP_DIR/docker-compose.yml" ] || [ -f "$LEGACY_APP_DIR/docker-compose.yaml" ]; then
                cd "$LEGACY_APP_DIR"
                COMPOSE_PROJECT_NAME=cinetech docker compose down || true
                cd "$APP_DIR"
              fi
            fi

            COMPOSE_PROJECT_NAME=kulturdb docker compose down || true

            # Nettoie les conteneurs eventuellement restes en conflit de nom.
            docker rm -f kulturdb-api kulturdb >/dev/null 2>&1 || true

            # Garde-fou: si 3003 est occupe par un conteneur inattendu, on echoue avec un message clair.
            PORT_OWNER=$(docker ps --filter "publish=3003" --format '{{.ID}} {{.Names}}' | head -n1 || true)
            if [ -n "$PORT_OWNER" ]; then
              echo "Le port 127.0.0.1:3003 est deja utilise: $PORT_OWNER"
              echo "Veuillez liberer ce port ou aligner le mapping Docker avant redeploiement."
              exit 1
            fi

            COMPOSE_PROJECT_NAME=kulturdb docker compose up -d --build
            docker image prune -f

            echo "--- Verification des conteneurs ---"
            docker ps

            echo "--- Test reponse interne port 3003 ---"
            curl -I http://127.0.0.1:3003 || true

            echo "=== Contenu de /etc/nginx/sites-available/moviedb ==="
            cat /etc/nginx/sites-available/moviedb 2>/dev/null || true

            echo "=== Contenu de /etc/nginx/sites-available/azim404 ==="
            cat /etc/nginx/sites-available/azim404 2>/dev/null || true

            echo "=== Certbot certificates list ==="
            sudo certbot certificates || true

            echo "=== Configuration Nginx pour kulturdb.azim404.com ==="
            printf '%s\n' \
              'server {' \
              '    listen 80;' \
              '    listen [::]:80;' \
              '    server_name kulturdb.azim404.com moviedb.azim404.com;' \
              '    location / {' \
              '        proxy_pass http://127.0.0.1:3003;' \
              '        proxy_http_version 1.1;' \
              '        proxy_set_header Upgrade $http_upgrade;' \
              '        proxy_set_header Connection '\''upgrade'\'';' \
              '        proxy_set_header Host $host;' \
              '        proxy_cache_bypass $http_upgrade;' \
              '        proxy_set_header X-Real-IP $remote_addr;' \
              '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
              '        proxy_set_header X-Forwarded-Proto $scheme;' \
              '    }' \
              '}' | sudo tee /etc/nginx/sites-available/kulturdb.azim404.com

            sudo ln -sf /etc/nginx/sites-available/kulturdb.azim404.com /etc/nginx/sites-enabled/kulturdb.azim404.com
            sudo rm -f /etc/nginx/sites-enabled/moviedb || true
            sudo nginx -t && (sudo systemctl reload nginx || sudo service nginx reload) || true

            echo "=== Obtention/renouvellement du certificat SSL pour kulturdb.azim404.com et azim404.com ==="
            sudo certbot --nginx -d kulturdb.azim404.com --non-interactive --agree-tos --register-unsafely-without-email --redirect || true
            sudo certbot --nginx -d azim404.com --non-interactive --agree-tos --register-unsafely-without-email || true

            sudo nginx -t && (sudo systemctl reload nginx || sudo service nginx reload) || true




